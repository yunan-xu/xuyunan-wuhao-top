<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#faf3eb" />
  <title>管理者页面 · 婚礼座位</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <div class="page admin-page">
    <header class="admin-header">
      <div>
        <h1>管理者页面</h1>
        <p class="admin-sub">XuYunan &amp; WuHao · 婚礼座位管理</p>
      </div>
      <a class="back-btn" href="./index.html">← 返回</a>
    </header>

    <!-- 名单查看 -->
    <section class="admin-card">
      <div class="card-head">
        <h2>全体宾客名单与座位</h2>
        <div class="head-btns">
          <button id="downloadBtn" class="mini-btn" type="button">下载数据</button>
          <button id="refreshBtn" class="mini-btn" type="button">刷新</button>
        </div>
      </div>
      <div id="stats" class="stats"></div>
      <div id="guestList" class="guest-list">
        <div class="loading">加载中…</div>
      </div>
    </section>

    <!-- 数据更新 -->
    <section class="admin-card">
      <h2>更新数据（覆盖导入）</h2>
      <p class="hint">上传新的 Excel（.xlsx/.xls）或 CSV 文件，四列：<b>姓名</b>、<b>桌号</b>、<b>人数</b>、<b>身份</b>（人数可不填，默认 1 人 = 占 1 个位置；身份可不填，如 A公司/男方亲友）。确认后将清空旧数据并写入新数据。</p>
      <label class="file-btn" for="fileInput">选择文件</label>
      <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" hidden />
      <div id="fileName" class="file-name"></div>
      <div id="preview" class="preview"></div>
      <button id="uploadBtn" class="upload-btn" type="button" disabled>确认覆盖并更新</button>
      <div id="uploadResult" class="upload-result"></div>
    </section>
  </div>

  <script src="./config.js?v=3"></script>
  <script src="./xlsx.full.min.js"></script>
  <script type="module" src="./admin.js?v=10"></script>
</body>
</html>
