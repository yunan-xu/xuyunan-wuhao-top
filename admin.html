<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#faf3eb" />
  <title>管理者页面 · 婚礼座位</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <div class="page admin-page">
    <header class="admin-header">
      <div>
        <h1>管理者页面</h1>
        <p class="admin-sub">XuYunan &amp; WuHao · 婚礼座位管理</p>
      </div>
      <a class="back-btn" href="./index.html">← 返回</a>
    </header>

    <!-- 名单查看 -->
    <section class="admin-card">
      <div class="card-head">
        <h2>全体宾客名单与座位</h2>
        <div class="head-btns">
          <button id="downloadBtn" class="mini-btn" type="button">下载数据</button>
          <button id="refreshBtn" class="mini-btn" type="button">刷新</button>
        </div>
      </div>
      <div id="stats" class="stats"></div>
      <div id="guestList" class="guest-list">
        <div class="loading">加载中…</div>
      </div>
    </section>

    <!-- 名单维护说明 -->
    <section class="admin-card">
      <h2>名单更新</h2>
      <p class="hint">名单为加密存储，更新请提供新名单文件（姓名 / 桌号 / 人数 / 身份），由维护人员处理后发布。</p>
    </section>
  </div>

  <script src="./config.js?v=3"></script>
  <script src="./xlsx.full.min.js"></script>
  <script type="module" src="./admin.js?v=13"></script>
</body>
</html>
